name: hustle
description: "All-in-one app for freelancers: Tasks, Time Tracking & Invoicing"
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Database
  sqflite: ^2.4.1
  path: ^1.9.0

  # Navigation
  go_router: ^14.2.7

  # Dependency Injection
  get_it: ^8.0.2

  # Charts
  fl_chart: ^0.69.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # File & Share
  share_plus: ^10.0.2
  path_provider: ^2.1.4

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Icons & UI
  cupertino_icons: ^1.0.8

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Monetization
  in_app_purchase: ^3.2.0
  purchases_flutter: ^8.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Polish / UX
  local_auth: ^2.3.0
  archive: ^3.6.1
  package_info_plus: ^8.0.2
  image_picker: ^1.1.2
  in_app_review: ^2.0.10
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  web: true
  windows: true
  macos: true
  linux: true
  image_path: "assets/icon/app_icon.png"
  image_path_android: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
